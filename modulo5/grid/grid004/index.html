<!-- GRID ITENS -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itens</title>
    <style>
        .container {
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            border: 3px solid pink;
            gap: 5px;
        }
        .caixa1 {
            border: 3px solid green;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: -1;
            background-color: aquamarine;
        }
        .caixa2 {
           border: 3px solid lightskyblue; 
           background-color: bisque;
           grid-row-start: 2;
           grid-row-end: 4;
           grid-column-start: 1;
           grid-column-end: -3;

        }
        .caixa3 {
           border: 3px solid lightskyblue; 
           background-color: lightgreen;
           grid-row-start: 2;
           grid-row-end: 4;
           grid-column-start: 3;
           grid-column-end: -1;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="caixa1">Caixa 1</div>
    <div class="caixa2">Caixa 2</div>
    <div class="caixa3">Caixa 3</div>
   </div>    
</body>
</html>
