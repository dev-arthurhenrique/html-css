<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animacao</title>
    <style>
       .item {
        width: 70px;
        height: 70px;
        background: #6369f1;
        animation: animacao 1s ease-in-out  backwards;
       }
       @keyframes animacao {
        0% {
            transform: scale(1);
        }
        25% {
            transform: scale(1.3);
        }
        50% {
            transform: rotate(45deg);
            background-color: dodgerblue;
        }
        100% {
            transform: rotate(0);
            background-color: tomato;
        }
       }
    </style>
</head>
<body>
   <div class="container">
    <div class="item">
        
    </div>
   </div>
</body>
</html>
