<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animacao</title>
    <style>
        .bola {
            width: 100px;
            height: 100px;
            background-color: dodgerblue;
            border-radius: 50%;
            animation: aparecer 2s ;
        }
        @keyframes aparecer {
            from {
                opacity: 0; 
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="bola"></div>
</body>
</html>
