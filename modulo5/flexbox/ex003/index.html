<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background-color: aquamarine;
        }
        main {
            background-color: bisque;
            height: 50%;
            width: 90%;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: blue;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
  <main>
    <section>
        <h1>Tela de login</h1>
    </section>
  </main>  
</body>
</html>
