<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .conteiner {
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;
            align-items: center;
            align-content: center;
            height: 400px;
            background-color: blueviolet;
        }
        .itens {
            margin: 10px;
            flex: 1 1 300px;
            align-self: self-end;
            padding: 20px;
            border: 1px solid black;
            background-color: aqua;
        }
    </style>
</head>
<body>
   <div class="conteiner">
    <div class="itens" id="i1">A</div>
    <div class="itens" id="i2">B</div>
    <div class="itens" id="i3">C</div>
   </div> 
</body>
</html>
