<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>
<body>
   <a href="#" id="clicar">Clique em mim</a> 
   <div id="saida"></div>
   <script>
    let clicar = document.getElementById('clicar')  
    let c = () => {
        let saida = document.getElementById('saida')
        saida.innerHTML += '<p>Você clicou</p>'
    }
    clicar.addEventListener('click', c)  
   </script>
</body>
</html>
