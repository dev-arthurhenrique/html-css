<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="name">
                Nome: <input type="text" name="name" id="name" required minlength="3" maxlength="30" size="30" autocomplete="name" placeholder="Informe seu nome">
            </label>
        </p>
        <p>
            <label for="senha">
                Senha: <input type="password" name="senha" id="senha" required minlength="8" maxlength="16" size="30" placeholder="senha de 8 dígitos"></label>
        </p>
        <p>
            <label for="mes">
                Mes: <input type="month" name="mes" id="mes" required>
            </label>
        </p>
        <p>
            <label for="dia">
                Dia: <input type="date" name="dia" id="dia" required>
            </label>
        </p>
        <p>
            <label for="hora">
                Hora: <input type="time" name="hora" id="hora" required>
            </label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
