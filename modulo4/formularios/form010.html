        </label>
        <p>
            <input type="checkbox" name="relembrar" id="relembrar"> <label for="relembrar">Remember me</label><a href="#">Forgot passWord ?</a>

        <p>
            <input type="submit" value="Login" id="login">

        <p id="nao-tem-conta">Don't have on account <a href="#">Registar</a></p>
    </form>
