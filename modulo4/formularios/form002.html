<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
   <h1>Meu segundo formulário</h1>
   <form action="cadastro.php" method="post" autocomplete="on">
       <p>
        <label for="user">
            Usuário: <input type="text" name="user" id="user" required placeholder="Informe seu nome" maxlength="15" autocomplete="username">
        </label>
       </p>
       <p>
        <label for="senha">
            Senha: <input type="password" name="senha" id="senha" required placeholder="A partir de 8 dígitos" minlength="8" maxlength="16" autocomplete="current-password">
        </label>
       </p>
       <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
       </p>
   </form>
</body>
</html>
