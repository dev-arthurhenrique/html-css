<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Select,datalist,textarea</legend>
            <p>
                <label for="estado">
                    Informe seu estado : 
                    <select name="estado" id="estado">
                        <option value="selected" selected>--- Escolha um estado ---</option>
                        <optgroup label="Nordeste">
                            <option value="al">Alagoas</option>
                            <option value="se">Sergipe</option>
                            <option value="pe">Pernambuco</option>
                            <option value="ba">Bahia</option>
                            <option value="pr">Paraíba</option>
                        </optgroup> 
                        <optgroup label="Sudeste">
                            <option value="sp">São Paulo</option>
                            <option value="rj">Rio de Janeiro</option>
                            <option value="mg">Minas Gerais</option>
                        </optgroup>
                    </select>
                </label>
            </p>
            <p>
                <label for="profissão">
                    Profissão: <input type="text" name="profissão" id="profissão" list="profissao">
                    <datalist id="profissao">
                        <option value="Desenvolvedor">Dev</option>
                    </datalist>
                </label>
            </p>
            <p>
                <label for="msg">
                    Mensagem: <textarea name="msg" id="msg" cols="50" rows="50"></textarea>
                </label>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
