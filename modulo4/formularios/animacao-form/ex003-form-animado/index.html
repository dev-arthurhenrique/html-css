<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <main>
       <h1>Login</h1>
       <form action="cadastro.php" method="post" autocomplete="off">
        <div class="formulario">
            <input type="email" name="email" id="email" required placeholder="Ex: amolegodcsupervillans@gmail.com" size="35">
            <label for="email">Email</label>
        </div>
        <div class="formulario">
            <input type="password" name="senha" id="senha" required placeholder="Senha de no mínimo 8 dígitos" size="35" minlength="8" maxlength="16">
            <label for="senha">Password</label>
        </div>
        <div class="restante">
            <label for="relembrar">
                <input type="checkbox" name="relembrar" id="relembrar"> Remember me
            </label>
            <a href="#">Forgot Password</a>
        </div>
        <div id="login">
            <input type="submit" value="Login">
        </div>
        <p>Don't have an account? <a href="#">Register</a></p>
       </form>
   </main>
</body>
</html>
