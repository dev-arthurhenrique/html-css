<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1{
            background-color: rgb(135, 166, 222);
            height: 300px;
            width: 300px;
            /*
            border-width: 10px;
            border-style: solid;
            border-color: lightblue;
            */
            border: 10px solid lightblue;
            padding: 10px;
            margin: auto;
            /*
            outline-width: 2px;
            outline-style: dashed;
            */
            outline: 20px dashed blue;
        }
        a{
            border: 10px dotted black;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p> O &lt;p&gt; Também são box-level, mas os &lt;a&gt;são inline <a href="#">oi</a> olha isso</p>
</body>
</html>
