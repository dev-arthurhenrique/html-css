<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class</title>
    <style>
        div{
            display: inline-block;
            background-color: aquamarine;
            width: 100px;
            height: 50px;
            margin: 5px;
            line-height: 50px;
            text-align: center;
            border-radius: 10px;
            border: 1px solid black;
        }
        div:hover{
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <h1>Trabalhando com Pseudo-class</h1>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
