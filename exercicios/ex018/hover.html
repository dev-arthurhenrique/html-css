<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        div{
            width: 250px;
            font: normal normal 1.2em 'Arial', sans-serif;
        }
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: rgb(98, 139, 192);
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <div>Arraste o mouse até Aqui
        <p>Texto escondido</p>
    </div>
</body>
</html>
