<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos, quebras, simbolos e emojis</title>
</head>
<body>
   <h1>Paragrafos &lt;p&gt;</h1> <!--lt less than, gt greater than-->
   <p>Não importa o jeito que eu escrevo



    sempre o paragrafos, cuja tag é &lt;p&gt;, fica em linha<br>reta se 

    estiver dentro <br>da tag
   </p>
   <hr>
   <h1>Quebras &lt;br&gt;</h1>
   <hr>
   <h1>Emojis &#x1F60E;</h1>
   <p>🫩</p>

</body>
</html>
