<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap');
        @font-face {
            font-family: 'star';
            src: url('Starborn.otf') format('opentype'), url('Starborn.ttf') format('truetype');
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'star', sans-serif;
            font-weight: normal;
        }
        p{
            font-family: "Berkshire Swash", serif;
        }
    </style>
</head>
<body>
   <h1>STaR</h1>
   <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Reprehenderit libero perspiciatis quis placeat earum harum officia esse at, dicta vel aperiam consectetur cum perferendis sunt, sequi recusandae eius amet laboriosam?</p> 
</body>
</html>
